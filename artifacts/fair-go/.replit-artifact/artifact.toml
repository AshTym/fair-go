kind = "web"
previewPath = "/"
title = "Fair Go"
description = "An AU/NZ-first dating app focused on honest pricing, verified profiles, and local match density. Includes onboarding, discovery, likes, matches, chat, filters, and trust-focused profile settings."
version = "1.0.0"
id = "artifacts/fair-go"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25768

[services.development]
run = "pnpm --filter @workspace/fair-go run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fair-go", "run", "build" ]
serve = "static"
publicDir = "artifacts/fair-go/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25768"
BASE_PATH = "/"
